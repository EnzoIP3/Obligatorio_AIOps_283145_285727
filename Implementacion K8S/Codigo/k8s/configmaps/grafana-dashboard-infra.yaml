apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra
  namespace: pharmago
data:
  pharmago-infra.json: |
    {
      "title": "PharmaGo - Infra",
      "uid": "pharmago-infra",
      "tags": ["pharmago", "infra"],
      "time": {"from": "now-15m", "to": "now"},
      "refresh": "5s",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "CPU por nodo (%)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{node}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 2,
          "title": "Memoria usada por nodo (%)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 3,
          "title": "Disco disponible por nodo (%)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "100 * (node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\", mountpoint=\"/\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\", mountpoint=\"/\"})", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "id": 4,
          "title": "Red por nodo (bytes/s)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (instance) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*\"}[5m]))", "legendFormat": "RX {{instance}}", "refId": "A"},
            {"expr": "sum by (instance) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*\"}[5m]))", "legendFormat": "TX {{instance}}", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps", "min": 0}}
        },
        {
          "id": 5,
          "title": "CPU por pod (cores)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}}
        },
        {
          "id": 6,
          "title": "Memoria por pod",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"pharmago\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}}
        },
        {
          "id": 7,
          "title": "Almacenamiento por contenedor",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 24, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod, container) (container_fs_usage_bytes{namespace=\"pharmago\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}} / {{container}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}}
        },
        {
          "id": 8,
          "title": "Red por pod (bytes/s)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 24, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"pharmago\", pod!=\"\"}[5m]))", "legendFormat": "RX {{pod}}", "refId": "A"},
            {"expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"pharmago\", pod!=\"\"}[5m]))", "legendFormat": "TX {{pod}}", "refId": "B"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps", "min": 0}}
        },
        {
          "id": 9,
          "title": "Pods activos",
          "type": "stat",
          "gridPos": {"x": 0, "y": 32, "w": 12, "h": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "count(count by (pod) (container_memory_working_set_bytes{namespace=\"pharmago\", pod!=\"\"}))", "legendFormat": "pods", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}}
        }
      ]
    }
