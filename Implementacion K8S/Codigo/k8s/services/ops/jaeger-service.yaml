apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: pharmago
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
    protocol: TCP
  - name: query
    port: 16686
    targetPort: query
    protocol: TCP
  type: ClusterIP
